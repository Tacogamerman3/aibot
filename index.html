<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SchoolChat</title>

<style>
:root {
  --bg: #0b0f10;
  --panel: #11181a;
  --teal: #14b8a6;
  --teal-dark: #0f766e;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --danger: #f87171;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

#top {
  background: var(--panel);
  padding: 10px;
  text-align: center;
  color: var(--teal);
  font-weight: bold;
}

#roomSetup {
  padding: 8px;
  text-align: center;
}

#chat {
  height: 50vh;
  overflow-y: auto;
  padding: 12px;
}

.msg {
  background: #0f1416;
  padding: 8px;
  margin-bottom: 8px;
  border-left: 3px solid var(--teal);
}

.msg.selectable {
  cursor: pointer;
}

.msg.selected {
  background: #3f1d1d;
  border-left-color: var(--f87171);
}

.time {
  font-size: 0.8em;
  color: var(--muted);
}

#input {
  display: flex;
  background: var(--panel);
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  background: #0f1416;
  color: var(--text);
}

button {
  background: var(--teal);
  border: none;
  padding: 8px 12px;
  margin: 4px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: var(--teal-dark);
}

#bulkDelete {
  display: none;
  text-align: center;
  padding: 6px;
}

#users {
  background: #0f1416;
  padding: 8px;
  border-top: 1px solid #1f2933;
  display: none;
}

.user {
  display: flex;
  justify-content: space-between;
  margin: 4px 0;
}

.kick {
  background: none;
  color: var(--danger);
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="top">SchoolChat</div>
<div id="roomSetup"></div>

<div id="bulkDelete">
  <button onclick="deleteSelected()">🗑️ Delete Selected</button>
</div>

<div id="chat"></div>

<div id="users">
  <b>People in room:</b>
  <div id="userList"></div>
</div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔧 FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews"
});

const db = firebase.database();

/* 🔗 ROOM VARIABLES */
const params = new URLSearchParams(location.search);
const roomId = params.get("room");
let chatRef, usersRef, bansRef, creatorRef;
let myName = "";
let isCreator = false;
let adminMode = false;
let secretBuffer = "";
let selectedMessages = new Set();

/* 👀 ROOM SETUP */
const roomSetupDiv = document.getElementById("roomSetup");

if (!roomId) {
  chatRef = db.ref("globalChat");
  roomSetupDiv.innerHTML = `
    <input id="roomName" placeholder="Room name">
    <button onclick="createRoom()">Create Private Room</button>
  `;
} else {
  chatRef = db.ref("rooms/" + roomId + "/messages");
  usersRef = db.ref("rooms/" + roomId + "/users");
  bansRef = db.ref("rooms/" + roomId + "/banned");
  creatorRef = db.ref("rooms/" + roomId + "/creator");

  document.getElementById("users").style.display = "block";

  // check if creator
  creatorRef.once("value", s => {
    if (s.val() === localStorage.getItem("creator:" + roomId)) {
      isCreator = true;
    }
  });

  usersRef.on("value", snap => {
    const list = document.getElementById("userList");
    list.innerHTML = "";
    snap.forEach(u => {
      const name = u.key;
      const div = document.createElement("div");
      div.className = "user";
      div.innerHTML = `
        <span>${name}${name === myName ? " (you)" : ""}</span>
        ${isCreator && name !== myName ? `<button class="kick" onclick="kick('${name}')">kick</button>` : ""}
      `;
      list.appendChild(div);
    });
  });
}

/* 🏗️ CREATE ROOM */
function createRoom() {
  const nameInput = document.getElementById("roomName");
  const roomNameValue = nameInput.value.trim();
  if (!roomNameValue) return alert("Room name required");

  const id = roomNameValue.toLowerCase().replace(/\s+/g, "-");
  const roomRef = db.ref("rooms/" + id);
  roomRef.set({
    name: roomNameValue,
    creator: roomNameValue
  }).then(() => {
    localStorage.setItem("creator:" + id, roomNameValue);
    location.search = "?room=" + id;
  }).catch(err => alert("Failed to create room: " + err));
}

/* 👥 JOIN ROOM */
function joinRoom() {
  myName = document.getElementById("name").value.trim() || "Anonymous";
  if (!roomId) return;

  bansRef.once("value", s => {
    if (s.hasChild(myName)) {
      alert("You are banned from this room.");
      location.href = location.pathname;
    } else {
      usersRef.child(myName).set(true);
      usersRef.child(myName).onDisconnect().remove();
    }
  });
}

/* 🥾 KICK USERS */
function kick(name) {
  if (!isCreator) return;
  if (!confirm(`Kick ${name} permanently?`)) return;

  bansRef.child(name).set(true);
  usersRef.child(name).remove();
}

/* ✉️ SEND MESSAGE */
function sendMessage() {
  if (!myName && roomId) joinRoom();
  const msg = document.getElementById("message").value.trim();
  if (!msg) return;

  chatRef.push({
    name: myName || "Anonymous",
    message: msg,
    time: new Date().toLocaleString()
  });

  document.getElementById("message").value = "";
}

/* 🔓 ADMIN MODE - MULTI DELETE */
document.addEventListener("keydown", e => {
  if (e.key.length === 1) {
    secretBuffer += e.key.toLowerCase();
    secretBuffer = secretBuffer.slice(-20);
    if (secretBuffer.includes("opensesame")) {
      adminMode = true;
      alert("🔓 Delete mode enabled");
      document.getElementById("bulkDelete").style.display = "block";
      document.querySelectorAll(".msg").forEach(m => m.classList.add("selectable"));
    }
  }
});

function deleteSelected() {
  if (!adminMode || selectedMessages.size === 0) return;
  if (!confirm(`Delete ${selectedMessages.size} messages?`)) return;
  selectedMessages.forEach(key => chatRef.child(key).remove());
  selectedMessages.clear();
}

/* 👂 LISTEN FOR MESSAGES */
chatRef.limitToLast(100).on("child_added", s => {
  const d = s.val();
  const key = s.key;

  const div = document.createElement("div");
  div.className = "msg";
  div.dataset.key = key;
  div.innerHTML = `
    <b>${d.name}</b>: ${d.message}
    <div class="time">${d.time}</div>
  `;

  // Multi-select
  div.onclick = () => {
    if (!adminMode) return;
    if (selectedMessages.has(key)) {
      selectedMessages.delete(key);
      div.classList.remove("selected");
    } else {
      selectedMessages.add(key);
      div.classList.add("selected");
    }
  };

  if (adminMode) div.classList.add("selectable");

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
});
</script>

</body>
</html>
