<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 0;
    }
    #chat {
      height: 80vh;
      overflow-y: auto;
      padding: 10px;
      border-bottom: 1px solid #333;
    }
    .msg {
      margin-bottom: 8px;
    }
    .time {
      color: #888;
      font-size: 0.8em;
    }
    #input {
      display: flex;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: none;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="chat"></div>

<div id="input">
  <input id="name" placeholder="Your name" />
  <input id="message" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews",
  storageBucket: "jewsjewsjewsjewsjews.firebasestorage.app",
  messagingSenderId: "916953901589",
  appId: "1:916953901589:web:bedc562fe6a9884a597c1c",
  measurementId: "G-R69WHE1XCV"
};

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const chatRef = db.ref("globalChat");

  function sendMessage() {
    const name = document.getElementById("name").value || "Anonymous";
    const message = document.getElementById("message").value;
    if (!message) return;

    chatRef.push({
      name,
      message,
      time: new Date().toLocaleString()
    });

    document.getElementById("message").value = "";
  }

  chatRef.limitToLast(100).on("child_added", snapshot => {
    const data = snapshot.val();
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `
      <b>${data.name}</b>: ${data.message}
      <div class="time">${data.time}</div>
    `;
    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop = chat.scrollHeight;
  });
</script>

</body>
</html>
