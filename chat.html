<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SchoolChat</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#eee;
  margin:0;
}
#top {
  background:#222;
  padding:8px;
  text-align:center;
}
#roomSetup {
  padding:10px;
  background:#1a1a1a;
  text-align:center;
}
#chat {
  height:70vh;
  overflow-y:auto;
  padding:10px;
}
.msg {
  margin-bottom:10px;
}
.time {
  color:#888;
  font-size:0.8em;
}
#input {
  display:flex;
}
input {
  flex:1;
  padding:10px;
  border:none;
}
button {
  background:#3b82f6;
  color:white;
  border:none;
  padding:6px 10px;
  cursor:pointer;
  margin:3px;
}
</style>
</head>

<body>

<div id="top">SchoolChat</div>
<div id="roomSetup"></div>
<div id="chat"></div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔧 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews",
  storageBucket: "jewsjewsjewsjewsjews.firebasestorage.app",
  messagingSenderId: "916953901589",
  appId: "1:916953901589:web:bedc562fe6a9884a597c1c",
  measurementId: "G-R69WHE1XCV"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🔗 ROOM LOGIC */
const params = new URLSearchParams(window.location.search);
let roomId = params.get("room");
let chatRef;
let usersRef;
let maxUsers = null;

/* 🧠 ROOM ID GENERATOR */
function generateRoomId() {
  return Math.random().toString(36).substring(2, 10);
}

/* 🔙 LAST ROOM MEMORY */
const lastRoom = localStorage.getItem("lastPrivateRoom");

/* 🚪 SETUP CHAT */
if (!roomId) {
  chatRef = db.ref("globalChat");

  let buttons = `
    <input id="limit" type="number" min="1" placeholder="How many people">
    <button onclick="createRoom()">Create Private Room</button>
  `;

  if (lastRoom) {
    buttons += `
      <br>
      <button onclick="goToLastRoom()">🔒 Go back to my private room</button>
    `;
  }

  document.getElementById("roomSetup").innerHTML = buttons;

} else {
  document.getElementById("top").innerText = "🔒 Private Room";

  document.getElementById("roomSetup").innerHTML = `
    <button onclick="copyRoomLink()">📋 Copy Room Link</button>
    <button onclick="goBack()">🔙 Back to Main Chat</button>
  `;

  chatRef = db.ref("rooms/" + roomId + "/messages");
  usersRef = db.ref("rooms/" + roomId + "/users");

  db.ref("rooms/" + roomId + "/maxUsers").once("value", snap => {
    maxUsers = snap.val();
  });
}

/* 🛠️ CREATE ROOM */
function createRoom() {
  const limit = document.getElementById("limit").value;
  if (!limit || limit < 1) return alert("Enter a valid user limit");

  const newRoom = generateRoomId();
  db.ref("rooms/" + newRoom).set({
    maxUsers: Number(limit)
  });

  localStorage.setItem("lastPrivateRoom", newRoom);
  window.location.search = "?room=" + newRoom;
}

/* 🔒 RETURN TO LAST ROOM */
function goToLastRoom() {
  const room = localStorage.getItem("lastPrivateRoom");
  if (room) {
    window.location.search = "?room=" + room;
  }
}

/* 📋 COPY LINK */
function copyRoomLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Room link copied!");
}

/* 🔙 BACK TO GLOBAL */
function goBack() {
  window.location.href = window.location.pathname;
}

/* 👥 JOIN ROOM */
function joinRoom(name) {
  if (!usersRef) return;

  usersRef.once("value", snap => {
    const count = snap.numChildren();
    if (maxUsers !== null && count >= maxUsers && !snap.hasChild(name)) {
      alert("Room is full");
      goBack();
      return;
    }
    usersRef.child(name).set(true);
  });
}

/* ✉️ SEND MESSAGE */
function sendMessage() {
  const name = document.getElementById("name").value || "Anonymous";
  const message = document.getElementById("message").value;
  if (!message) return;

  if (roomId) joinRoom(name);

  chatRef.push({
    name,
    message,
    time: new Date().toLocaleString()
  });

  document.getElementById("message").value = "";
}

/* 👂 LISTEN */
chatRef.limitToLast(100).on("child_added", snap => {
  const d = snap.val();
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `
    <b>${d.name}</b>: ${d.message}
    <div class="time">${d.time}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
