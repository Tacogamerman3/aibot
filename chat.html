<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Global Chat with Private Replies</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#eee;
  margin:0;
}
#chat {
  height:70vh;
  overflow-y:auto;
  padding:10px;
}
.msg {
  margin-bottom:10px;
}
.time {
  color:#888;
  font-size:0.8em;
}
button {
  background:#3b82f6;
  border:none;
  color:white;
  padding:5px 8px;
  cursor:pointer;
  margin-left:5px;
}
#input {
  display:flex;
}
input {
  flex:1;
  padding:10px;
  border:none;
}
#mode {
  padding:5px;
  background:#222;
  text-align:center;
}
</style>
</head>

<body>

<div id="mode">🌍 Global Chat</div>
<div id="chat"></div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews",
  storageBucket: "jewsjewsjewsjewsjews.firebasestorage.app",
  messagingSenderId: "916953901589",
  appId: "1:916953901589:web:bedc562fe6a9884a597c1c",
  measurementId: "G-R69WHE1XCV"
}

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentMode = "global";
let privateWith = null;
let chatRef = db.ref("globalChat");

function switchToGlobal() {
  currentMode = "global";
  privateWith = null;
  chatRef.off();
  document.getElementById("chat").innerHTML = "";
  document.getElementById("mode").innerText = "🌍 Global Chat";
  chatRef = db.ref("globalChat");
  listen();
}

function openPrivateChat(otherUser) {
  const me = document.getElementById("name").value;
  if (!me) return alert("Enter your name first");

  currentMode = "private";
  privateWith = otherUser;

  const chatId = [me, otherUser].sort().join("_");
  chatRef.off();
  document.getElementById("chat").innerHTML = "";
  document.getElementById("mode").innerHTML =
    `🔒 Private chat with <b>${otherUser}</b>
     <button onclick="switchToGlobal()">Back</button>`;

  chatRef = db.ref("privateChats/" + chatId);
  listen();
}

function sendMessage() {
  const name = document.getElementById("name").value || "Anonymous";
  const message = document.getElementById("message").value;
  if (!message) return;

  chatRef.push({
    name,
    message,
    time: new Date().toLocaleString()
  });

  document.getElementById("message").value = "";
}

function listen() {
  chatRef.limitToLast(100).on("child_added", snap => {
    const d = snap.val();
    const div = document.createElement("div");
    div.className = "msg";

    let replyBtn = "";
    if (currentMode === "global" && d.name !== document.getElementById("name").value) {
      replyBtn = `<button onclick="openPrivateChat('${d.name}')">Reply privately</button>`;
    }

    div.innerHTML = `
      <b>${d.name}</b>: ${d.message}
      ${replyBtn}
      <div class="time">${d.time}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  });
}

listen();
</script>

</body>
</html>
