<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bowie Chat</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:#eee;
  margin:0;
}
#mode {
  background:#222;
  padding:8px;
  text-align:center;
}
#chat {
  height:70vh;
  overflow-y:auto;
  padding:10px;
}
.msg {
  margin-bottom:10px;
}
.time {
  font-size:0.8em;
  color:#888;
}
button {
  background:#3b82f6;
  border:none;
  color:white;
  padding:4px 7px;
  cursor:pointer;
  margin-left:5px;
}
#input {
  display:flex;
}
input {
  flex:1;
  padding:10px;
  border:none;
}
</style>
</head>

<body>

<div id="mode">Bowie Chat</div>
<div id="chat"></div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔧 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🔁 STATE */
let currentMode = "global";
let privateWith = null;
let chatRef = db.ref("globalChat");

/* 🔔 LISTEN FOR PRIVATE INBOX */
function listenForInbox() {
  const me = document.getElementById("name").value;
  if (!me) return;

  db.ref("privateInbox/" + me).on("child_added", snap => {
    const data = snap.val();
    const from = data.from;

    if (currentMode === "global") {
      if (confirm(`🔔 Private message from ${from}. Open chat?`)) {
        openPrivateChat(from);
      }
    }
  });
}

document.getElementById("name").addEventListener("blur", listenForInbox);

/* 🔄 SWITCH TO GLOBAL */
function switchToGlobal() {
  currentMode = "global";
  privateWith = null;
  chatRef.off();
  chat.innerHTML = "";
  document.getElementById("mode").innerText = "🌍 Global Chat";
  chatRef = db.ref("globalChat");
  listen();
}

/* 🔒 OPEN PRIVATE CHAT */
function openPrivateChat(otherUser) {
  const me = document.getElementById("name").value;
  if (!me) return alert("Enter your name first");

  currentMode = "private";
  privateWith = otherUser;

  const chatId = [me, otherUser].sort().join("_");
  chatRef.off();
  chat.innerHTML = "";

  document.getElementById("mode").innerHTML =
    `🔒 Private chat with <b>${otherUser}</b>
     <button onclick="switchToGlobal()">Back</button>`;

  chatRef = db.ref("privateChats/" + chatId);
  listen();
}

/* ✉️ SEND MESSAGE */
function sendMessage() {
  const name = document.getElementById("name").value || "Anonymous";
  const message = document.getElementById("message").value;
  if (!message) return;

  chatRef.push({
    name,
    message,
    time: new Date().toLocaleString()
  });

  /* 🔔 NOTIFY OTHER USER IF PRIVATE */
  if (currentMode === "private") {
    const chatId = [name, privateWith].sort().join("_");
    db.ref("privateInbox/" + privateWith + "/" + chatId).set({
      from: name,
      time: Date.now()
    });
  }

  document.getElementById("message").value = "";
}

/* 👂 LISTEN FOR MESSAGES */
function listen() {
  chatRef.limitToLast(100).on("child_added", snap => {
    const d = snap.val();
    const div = document.createElement("div");
    div.className = "msg";

    let replyBtn = "";
    if (currentMode === "global" && d.name !== document.getElementById("name").value) {
      replyBtn = `<button onclick="openPrivateChat('${d.name}')">Reply privately</button>`;
    }

    div.innerHTML = `
      <b>${d.name}</b>: ${d.message}
      ${replyBtn}
      <div class="time">${d.time}</div>
    `;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  });
}

listen();
</script>

</body>
</html>
