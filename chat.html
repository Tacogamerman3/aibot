<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SchoolChat</title>

<style>
@media screen and (min-width: 768px) { body { zoom: 90%; } }

:root {
  --bg: #0b0f10;
  --panel: #11181a;
  --teal: #14b8a6;
  --teal-dark: #0f766e;
  --text: #e5e7eb;
  --muted: #9ca3af;
}

body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); margin:0; }

#top { background: var(--panel); padding:10px; text-align:center; color:var(--teal); font-weight:bold; }
#roomSetup { padding:10px; background:#0f1416; text-align:center; }
#chat { height:70vh; overflow-y:auto; padding:12px; }
.msg { background:#0f1416; padding:8px 10px; margin-bottom:8px; border-left:3px solid var(--teal); }
.time { font-size:0.8em; color:var(--muted); }
#input { display:flex; background:var(--panel); }
input, select { flex:1; padding:12px; border:none; background:#0f1416; color:var(--text); }
button { background:var(--teal); border:none; padding:8px 12px; margin:4px; cursor:pointer; font-weight:bold; }
button:hover { background:var(--teal-dark); }
.delete-btn { background:transparent; color:#f87171; border:none; cursor:pointer; font-size:0.8em; }
.reply-btn { background:transparent; color:#14b8a6; border:none; cursor:pointer; font-size:0.8em; margin-left:5px; }
.reply-container { margin-left:15px; border-left:1px dashed #14b8a6; padding-left:10px; margin-top:5px; }
</style>
</head>

<body>

<div id="top">SchoolChat</div>
<div id="roomSetup"></div>
<div id="chat"></div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔧 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews",
  storageBucket: "jewsjewsjewsjewsjews.firebasestorage.app",
  messagingSenderId: "916953901589",
  appId: "1:916953901589:web:bedc562fe6a9884a597c1c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🔐 ADMIN MODE */
let adminMode = false;
let secretBuffer = "";
document.addEventListener("keydown", e => {
  if (e.key.length === 1) {
    secretBuffer += e.key.toLowerCase();
    secretBuffer = secretBuffer.slice(-20);
    if (secretBuffer.includes("opensesame")) {
      adminMode = true;
      alert("🔓 Delete mode enabled");
      document.querySelectorAll(".delete-btn").forEach(b => b.style.display = "inline");
    }
  }
});

/* 🧠 PREVIOUS ROOMS */
function getRooms() { return JSON.parse(localStorage.getItem("previousRooms") || "[]"); }
function saveRoom(id,name){ let rooms=getRooms().filter(r=>r.id!==id); rooms.unshift({id,name}); localStorage.setItem("previousRooms",JSON.stringify(rooms.slice(0,10))); }
function deleteRoom(id){ let rooms=getRooms().filter(r=>r.id!==id); localStorage.setItem("previousRooms",JSON.stringify(rooms)); location.reload(); }
function renderRoomDropdown(){ const rooms=getRooms(); if(!rooms.length) return ""; let html=`<details><summary style="cursor:pointer;color:var(--teal)">🔽 Previous Rooms</summary>`; rooms.forEach(r=>{ html+=`<div style="margin:5px"><button onclick="location.search='?room=${r.id}'">🔒 ${r.name}</button><button class="delete-btn" onclick="deleteRoom('${r.id}')">🗑️</button></div>`; }); html+=`</details>`; return html; }

/* 🔗 ROOM LOGIC */
const params = new URLSearchParams(location.search);
const roomId = params.get("room");
let chatRef;

/* 🚪 SETUP */
if(!roomId){
  chatRef = db.ref("globalChat");
  roomSetup.innerHTML = `<input id="roomName" placeholder="Room name"><button onclick="createRoom()">Create Private Room</button><hr>${renderRoomDropdown()}`;
}else{
  chatRef = db.ref("rooms/"+roomId+"/messages");
  db.ref("rooms/"+roomId+"/name").once("value", s=>{ top.innerText="🔒 "+(s.val()||"Private Room"); saveRoom(roomId,s.val()); });
  roomSetup.innerHTML=`<button onclick="copyRoomLink()">📋 Copy Room Link</button><button onclick="goBack()">🔙 Back</button>`;
}

/* 🛠️ CREATE ROOM */
function createRoom(){ const name=document.getElementById("roomName").value.trim(); if(!name) return alert("Enter room name"); const id=name.toLowerCase().replace(/\s+/g,"-")+"-"+Date.now(); db.ref("rooms/"+id).set({name}); saveRoom(id,name); location.search="?room="+id; }
function goBack(){ location.href=location.pathname; }
function copyRoomLink(){ navigator.clipboard.writeText(location.href); alert("Link copied"); }

/* ✉️ SEND MESSAGE */
function sendMessage(replyTo=null, privateReply=false){
  const name=document.getElementById("name").value||"Anonymous";
  const msg=document.getElementById("message").value;
  if(!msg) return;
  const data = { name, message: msg, time: new Date().toLocaleString(), replies:{} };
  if(replyTo){
    db.ref(chatRef.path.pieces_.join('/')+'/'+replyTo+'/replies').push({ ...data, private: privateReply, originalSender: replyTo.originalSender||name });
  }else{
    chatRef.push(data);
  }
  document.getElementById("message").value="";
}

/* 🗑️ DELETE */
function deleteMessage(key){ if(!adminMode) return; if(!confirm("Delete this message?")) return; chatRef.child(key).remove(); }

/* 👂 LISTEN */
chatRef.limitToLast(100).on("child_added", s=>{
  const d=s.val(); const key=s.key;
  const div=document.createElement("div");
  div.className="msg";
  const name=document.getElementById("name").value||"Anonymous";
  
  function renderReplies(repliesObj){
    const container=document.createElement("div");
    container.className="reply-container";
    if(!repliesObj) return container;
    Object.keys(repliesObj).forEach(rKey=>{
      const r=repliesObj[rKey];
      if(r.private && r.originalSender!==name && r.name!==name) return;
      const rDiv=document.createElement("div");
      rDiv.innerHTML=`<b>${r.name}${r.private?" (private)":""}</b>: ${r.message}<div class="time">${r.time}</div>`;
      container.appendChild(rDiv);
    });
    return container;
  }
  
  div.innerHTML=`<b>${d.name}</b>: ${d.message}<div class="time">${d.time}</div>`;
  const replyBtn=document.createElement("button");
  replyBtn.className="reply-btn";
  replyBtn.textContent="Reply";
  replyBtn.onclick=()=>{ const msg=prompt("Reply message"); if(msg) sendMessage({originalSender:d.name,key:key}, false); };
  
  const privateBtn=document.createElement("button");
  privateBtn.className="reply-btn";
  privateBtn.textContent="Private Reply";
  privateBtn.onclick=()=>{ const msg=prompt("Private reply message"); if(msg) sendMessage({originalSender:d.name,key:key}, true); };
  
  div.appendChild(replyBtn);
  div.appendChild(privateBtn);
  div.appendChild(renderReplies(d.replies));
  
  const delBtn=document.createElement("button");
  delBtn.className="delete-btn";
  delBtn.style.display=adminMode?"inline":"none";
  delBtn.textContent="🗑️";
  delBtn.onclick=()=>deleteMessage(key);
  div.appendChild(delBtn);
  
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
});
</script>

</body>
</html>
