<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SchoolChat</title>

<style>
@media screen and (min-width: 768px) {
  body { zoom: 90%; }
}

:root {
  --bg: #0b0f10;
  --panel: #11181a;
  --teal: #14b8a6;
  --teal-dark: #0f766e;
  --text: #e5e7eb;
  --muted: #9ca3af;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
}

#top {
  background: var(--panel);
  padding: 10px;
  text-align: center;
  color: var(--teal);
  font-weight: bold;
}

#roomSetup {
  padding: 10px;
  background: #0f1416;
  text-align: center;
}

#chat {
  height: 70vh;
  overflow-y: auto;
  padding: 12px;
}

.msg {
  background: #0f1416;
  padding: 8px 10px;
  margin-bottom: 8px;
  border-left: 3px solid var(--teal);
}

.time {
  font-size: 0.8em;
  color: var(--muted);
}

#input {
  display: flex;
  background: var(--panel);
}

input, select {
  flex: 1;
  padding: 12px;
  border: none;
  background: #0f1416;
  color: var(--text);
}

button {
  background: var(--teal);
  border: none;
  padding: 8px 12px;
  margin: 4px;
  cursor: pointer;
  font-weight: bold;
}

button:hover { background: var(--teal-dark); }

.delete-btn {
  background: transparent;
  color: #f87171;
  border: none;
  cursor: pointer;
  font-size: 0.8em;
}
</style>
</head>

<body>

<div id="top">SchoolChat</div>
<div id="roomSetup"></div>
<div id="chat"></div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔧 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews",
  storageBucket: "jewsjewsjewsjewsjews.firebasestorage.app",
  messagingSenderId: "916953901589",
  appId: "1:916953901589:web:bedc562fe6a9884a597c1c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🧠 PREVIOUS ROOMS */
function getRooms() {
  return JSON.parse(localStorage.getItem("previousRooms") || "[]");
}

function saveRoom(id, name) {
  let rooms = getRooms().filter(r => r.id !== id);
  rooms.unshift({ id, name });
  localStorage.setItem("previousRooms", JSON.stringify(rooms.slice(0, 10)));
}

function deleteRoom(id) {
  let rooms = getRooms().filter(r => r.id !== id);
  localStorage.setItem("previousRooms", JSON.stringify(rooms));
  location.reload();
}

function renderRoomDropdown() {
  const rooms = getRooms();
  if (!rooms.length) return "";

  let html = `
    <details>
      <summary style="cursor:pointer;color:var(--teal)">🔽 Previous Rooms</summary>
  `;

  rooms.forEach(r => {
    html += `
      <div style="margin:5px">
        <button onclick="location.search='?room=${r.id}'">🔒 ${r.name}</button>
        <button class="delete-btn" onclick="deleteRoom('${r.id}')">🗑️</button>
      </div>
    `;
  });

  html += `</details>`;
  return html;
}

/* 🔗 ROOM LOGIC */
const params = new URLSearchParams(location.search);
const roomId = params.get("room");
let chatRef, usersRef, maxUsers = null;

/* 🚪 SETUP */
if (!roomId) {
  chatRef = db.ref("globalChat");

  document.getElementById("roomSetup").innerHTML = `
    <input id="roomName" placeholder="Room name">
    <input id="limit" type="number" min="1" placeholder="How many people">
    <button onclick="createRoom()">Create Private Room</button>
    <hr>
    ${renderRoomDropdown()}
  `;
} else {
  chatRef = db.ref("rooms/" + roomId + "/messages");
  usersRef = db.ref("rooms/" + roomId + "/users");

  db.ref("rooms/" + roomId + "/name").once("value", s => {
    const name = s.val() || "Private Room";
    document.getElementById("top").innerText = "🔒 " + name;
    saveRoom(roomId, name);
  });

  db.ref("rooms/" + roomId + "/maxUsers").once("value", s => {
    maxUsers = s.val();
  });

  document.getElementById("roomSetup").innerHTML = `
    <button onclick="copyRoomLink()">📋 Copy Room Link</button>
    <button onclick="goBack()">🔙 Back to Main Chat</button>
  `;
}

/* 🛠️ CREATE ROOM */
function createRoom() {
  const name = roomName.value.trim();
  const limit = limitInput.value || limit.value;
  if (!name || limit < 1) return alert("Invalid input");

  const id = name.toLowerCase().replace(/\s+/g, "-");

  db.ref("rooms/" + id).set({ name, maxUsers: Number(limit) });
  saveRoom(id, name);
  location.search = "?room=" + id;
}

function goBack() {
  location.href = location.pathname;
}

function copyRoomLink() {
  navigator.clipboard.writeText(location.href);
  alert("Link copied");
}

/* 👥 JOIN */
function joinRoom(name) {
  usersRef.once("value", s => {
    if (maxUsers !== null && s.numChildren() >= maxUsers && !s.hasChild(name)) {
      alert("Room full");
      goBack();
    } else usersRef.child(name).set(true);
  });
}

/* ✉️ SEND */
function sendMessage() {
  const name = document.getElementById("name").value || "Anonymous";
  const msg = message.value;
  if (!msg) return;
  if (roomId) joinRoom(name);

  chatRef.push({
    name,
    message: msg,
    time: new Date().toLocaleString()
  });

  message.value = "";
}

/* 👂 LISTEN */
chatRef.limitToLast(100).on("child_added", s => {
  const d = s.val();
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `
    <b>${d.name}</b>: ${d.message}
    <div class="time">${d.time}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
