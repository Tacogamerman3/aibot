<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolChat</title>
  <style>
    /* Basic reset and styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #4CAF50;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      position: relative;
    }

    #people-count {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
    }

    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #fff;
      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
    }

    .message {
      margin-bottom: 10px;
      word-wrap: break-word;
    }

    #input-container {
      display: flex;
      padding: 10px;
      background: #eee;
    }

    #message-input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #send-btn {
      padding: 10px 20px;
      margin-left: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    #send-btn:hover {
      background: #45a049;
    }

    /* Make links in messages clickable */
    .message a {
      color: #1a0dab;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    SchoolChat
    <span id="people-count">People: 1</span>
  </header>

  <div id="chat-box">
    <div class="message">Welcome to SchoolChat!</div>
  </div>

  <div id="input-container">
    <input type="text" id="message-input" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const peopleCount = document.getElementById('people-count');

    let people = 1; // Initial number of people

    // Update people count (for demo purposes, increment each message)
    function updatePeopleCount() {
      people++;
      peopleCount.textContent = `People: ${people}`;
    }

    // Convert URLs to clickable links
    function linkify(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank">${url}</a>`);
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const message = document.createElement('div');
      message.classList.add('message');
      message.innerHTML = linkify(text);

      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;

      input.value = '';
      updatePeopleCount();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
