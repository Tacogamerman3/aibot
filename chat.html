<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SchoolChat</title>

<style>
      @media screen and (min-width: 768px) {
            body {
                zoom: 90%;
            }
        }
:root {
  --bg: #0b0f10;
  --panel: #11181a;
  --teal: #14b8a6;
  --teal-dark: #0f766e;
  --text: #e5e7eb;
  --muted: #9ca3af;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
}

#top {
  background: var(--panel);
  padding: 10px;
  text-align: center;
  color: var(--teal);
  font-weight: bold;
}

#roomSetup {
  padding: 10px;
  background: #0f1416;
  text-align: center;
}

#chat {
  height: 70vh;
  overflow-y: auto;
  padding: 12px;
}

.msg {
  background: #0f1416;
  padding: 8px 10px;
  margin-bottom: 8px;
  border-left: 3px solid var(--teal);
}

.time {
  font-size: 0.8em;
  color: var(--muted);
}

#input {
  display: flex;
  background: var(--panel);
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  background: #0f1416;
  color: var(--text);
}

input::placeholder {
  color: var(--muted);
}

button {
  background: var(--teal);
  color: #002;
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  margin: 3px;
  font-weight: bold;
}

button:hover {
  background: var(--teal-dark);
}

.delete-btn {
  background: transparent;
  color: #f87171;
  border: none;
  cursor: pointer;
  font-size: 0.8em;
  margin-left: 6px;
}
</style>
</head>

<body>

<div id="top">SchoolChat</div>
<div id="roomSetup"></div>
<div id="chat"></div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔧 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews",
  storageBucket: "jewsjewsjewsjewsjews.firebasestorage.app",
  messagingSenderId: "916953901589",
  appId: "1:916953901589:web:bedc562fe6a9884a597c1c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🔗 ROOM LOGIC */
const params = new URLSearchParams(window.location.search);
let roomId = params.get("room");
let chatRef;
let usersRef;
let maxUsers = null;

const lastRoom = localStorage.getItem("lastPrivateRoom");

/* 🧠 ROOM ID */
function generateRoomId() {
  return Math.random().toString(36).substring(2, 10);
}

/* 🚪 SETUP */
if (!roomId) {
  chatRef = db.ref("globalChat");

  let ui = `
    <input id="limit" type="number" min="1" placeholder="how many people">
    <button onclick="createRoom()">Create Private Room</button>
  `;

  if (lastRoom) {
    ui += `<br><button onclick="goToLastRoom()">🔒 Go back to my private room</button>`;
  }

  document.getElementById("roomSetup").innerHTML = ui;
} else {
  document.getElementById("top").innerText = "🔒 Private Room";

  document.getElementById("roomSetup").innerHTML = `
    <button onclick="copyRoomLink()">📋 Copy Room Link</button>
    <button onclick="goBack()">🔙 Back to Main Chat</button>
  `;

  chatRef = db.ref("rooms/" + roomId + "/messages");
  usersRef = db.ref("rooms/" + roomId + "/users");

  db.ref("rooms/" + roomId + "/maxUsers").once("value", snap => {
    maxUsers = snap.val();
  });
}

/* 🛠️ CREATE ROOM */
function createRoom() {
  const limit = document.getElementById("limit").value;
  if (!limit || limit < 1) return alert("Enter a valid user limit");

  const newRoom = generateRoomId();
  db.ref("rooms/" + newRoom).set({ maxUsers: Number(limit) });

  localStorage.setItem("lastPrivateRoom", newRoom);
  window.location.search = "?room=" + newRoom;
}

function goToLastRoom() {
  const room = localStorage.getItem("lastPrivateRoom");
  if (room) window.location.search = "?room=" + room;
}

function copyRoomLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Room link copied!");
}

function goBack() {
  window.location.href = window.location.pathname;
}

/* 👥 JOIN ROOM */
function joinRoom(name) {
  if (!usersRef) return;

  usersRef.once("value", snap => {
    const count = snap.numChildren();
    if (maxUsers !== null && count >= maxUsers && !snap.hasChild(name)) {
      alert("Room is full");
      goBack();
      return;
    }
    usersRef.child(name).set(true);
  });
}

/* ✉️ SEND */
function sendMessage() {
  const name = document.getElementById("name").value || "Anonymous";
  const message = document.getElementById("message").value;
  if (!message) return;

  if (roomId) joinRoom(name);

  chatRef.push({
    name,
    message,
    time: new Date().toLocaleString()
  });

  document.getElementById("message").value = "";
}

/* 🗑️ DELETE MESSAGE */
function deleteMessage(key) {
  if (confirm("Delete this message?")) {
    chatRef.child(key).remove();
  }
}

/* 👂 LISTEN */
chatRef.limitToLast(100).on("child_added", snap => {
  const d = snap.val();
  const key = snap.key;
  const me = document.getElementById("name").value;

  const div = document.createElement("div");
  div.className = "msg";

  const deleteBtn =
    d.name === me
      ? `<button class="delete-btn" onclick="deleteMessage('${key}')">Delete</button>`
      : "";

  div.innerHTML = `
    <b>${d.name}</b>: ${d.message}
    ${deleteBtn}
    <div class="time">${d.time}</div>
  `;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
