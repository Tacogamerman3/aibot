<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SchoolChat</title>

<style>
:root {
  --bg: #0b0f10;
  --panel: #11181a;
  --teal: #14b8a6;
  --teal-dark: #0f766e;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --danger: #f87171;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

#top {
  background: var(--panel);
  padding: 10px;
  text-align: center;
  color: var(--teal);
  font-weight: bold;
}

#roomSetup {
  padding: 8px;
  text-align: center;
}

#chat {
  height: 60vh;
  overflow-y: auto;
  padding: 12px;
}

.msg {
  background: #0f1416;
  padding: 8px;
  margin-bottom: 8px;
  border-left: 3px solid var(--teal);
}

.time {
  font-size: 0.8em;
  color: var(--muted);
}

#input {
  display: flex;
  background: var(--panel);
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  background: #0f1416;
  color: var(--text);
}

button {
  background: var(--teal);
  border: none;
  padding: 8px 12px;
  margin: 4px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: var(--teal-dark);
}

#users {
  background: #0f1416;
  padding: 8px;
  border-top: 1px solid #1f2933;
}

.user {
  display: flex;
  justify-content: space-between;
  margin: 4px 0;
}

.kick {
  background: none;
  color: var(--danger);
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="top">SchoolChat</div>
<div id="roomSetup"></div>
<div id="chat"></div>

<div id="users" style="display:none">
  <b>People in room</b>
  <div id="userList"></div>
</div>

<div id="input">
  <input id="name" placeholder="Your name">
  <input id="message" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔧 FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyBY9HBBcV_YNZ020xbhukg6GqGEreF6QD4",
  authDomain: "jewsjewsjewsjewsjews.firebaseapp.com",
  databaseURL: "https://jewsjewsjewsjewsjews-default-rtdb.firebaseio.com",
  projectId: "jewsjewsjewsjewsjews"
});

const db = firebase.database();

/* 🔗 ROOM */
const params = new URLSearchParams(location.search);
const roomId = params.get("room");
let chatRef, usersRef, bansRef, creatorRef;
let myName = "";
let isCreator = false;

if (!roomId) {
  roomSetup.innerHTML = `
    <input id="roomName" placeholder="Room name">
    <button onclick="createRoom()">Create Room</button>
  `;
  chatRef = db.ref("globalChat");
} else {
  chatRef = db.ref("rooms/" + roomId + "/messages");
  usersRef = db.ref("rooms/" + roomId + "/users");
  bansRef = db.ref("rooms/" + roomId + "/banned");
  creatorRef = db.ref("rooms/" + roomId + "/creator");

  document.getElementById("users").style.display = "block";

  creatorRef.once("value", s => {
    if (s.val() === localStorage.getItem("creator:" + roomId)) {
      isCreator = true;
    }
  });

  usersRef.on("value", snap => {
    userList.innerHTML = "";
    snap.forEach(u => {
      const name = u.key;
      const div = document.createElement("div");
      div.className = "user";
      div.innerHTML = `
        <span>${name}${isCreator && name === myName ? " (you)" : ""}</span>
        ${isCreator && name !== myName
          ? `<button class="kick" onclick="kick('${name}')">kick</button>`
          : ""}
      `;
      userList.appendChild(div);
    });
  });
}

/* 🏗️ CREATE ROOM */
function createRoom() {
  const name = roomName.value.trim();
  if (!name) return alert("Room name required");

  const id = name.toLowerCase().replace(/\s+/g, "-");
  db.ref("rooms/" + id).set({
    name,
    creator: name
  });

  localStorage.setItem("creator:" + id, name);
  location.search = "?room=" + id;
}

/* 👥 JOIN */
function joinRoom() {
  myName = document.getElementById("name").value || "Anonymous";

  bansRef.once("value", s => {
    if (s.hasChild(myName)) {
      alert("You are banned from this room.");
      location.href = location.pathname;
    } else {
      usersRef.child(myName).set(true);
      usersRef.child(myName).onDisconnect().remove();
    }
  });
}

/* 🥾 KICK */
function kick(name) {
  if (!isCreator) return;
  if (!confirm(`Kick ${name} permanently?`)) return;

  bansRef.child(name).set(true);
  usersRef.child(name).remove();
}

/* ✉️ SEND */
function sendMessage() {
  if (!myName && roomId) joinRoom();

  const msg = message.value.trim();
  if (!msg) return;

  chatRef.push({
    name: myName || "Anonymous",
    message: msg,
    time: new Date().toLocaleString()
  });

  message.value = "";
}

/* 👂 LISTEN */
chatRef.limitToLast(100).on("child_added", s => {
  const d = s.val();
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `
    <b>${d.name}</b>: ${d.message}
    <div class="time">${d.time}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
